name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which parts of the repo need checking. Service jobs also wait until the service exists.
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      client: ${{ steps.filter.outputs.client }}
      lobby: ${{ steps.filter.outputs.lobby == 'true' && steps.present.outputs.lobby == 'true' }}
      signaling: ${{ steps.filter.outputs.signaling == 'true' && steps.present.outputs.signaling == 'true' }}
      world: ${{ steps.filter.outputs.world == 'true' && steps.present.outputs.world == 'true' }}
      metadata: ${{ steps.filter.outputs.metadata == 'true' && steps.present.outputs.metadata == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            contracts:
              - *workflow
              - contracts/**
            client:
              - *workflow
              - contracts/**
              - client/**
            lobby:
              - *workflow
              - contracts/**
              - lobby-service/**
            signaling:
              - *workflow
              - contracts/**
              - signaling-service/**
            world:
              - *workflow
              - contracts/**
              - world-service/**
            metadata:
              - *workflow
              - contracts/**
              - metadata-service/**
      - id: present
        run: |
          has() { compgen -G "$1" > /dev/null && echo true || echo false; }
          echo "lobby=$(has 'lobby-service/pom.xml')" >> "$GITHUB_OUTPUT"
          echo "signaling=$(has 'signaling-service/go.mod')" >> "$GITHUB_OUTPUT"
          echo "world=$(has 'world-service/pyproject.toml')" >> "$GITHUB_OUTPUT"
          echo "metadata=$(has 'metadata-service/*.sln*')" >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Validate examples and world rules
        run: npm test
      - name: Lint OpenAPI
        run: npm run lint

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Contract types are up to date
        run: |
          npm run contracts:types
          git diff --exit-code -- src/shared/contracts || {
            echo "::error::Generated contract types are stale. Run npm run contracts:types in client/ and commit the result."
            exit 1
          }
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Browser smoke test
        run: npm run test:smoke

  lobby:
    needs: changes
    if: needs.changes.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobby-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build, format check and test
        run: mvn -B verify

  signaling:
    needs: changes
    if: needs.changes.outputs.signaling == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: signaling-service/go.mod
          cache-dependency-path: signaling-service/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  world:
    needs: changes
    if: needs.changes.outputs.world == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest

  metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metadata-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet format --verify-no-changes
      - run: dotnet test

  # The only required check. Skipped jobs count as passing, so PRs that touch one area are not
  # held up by checks for the others.
  ci-passed:
    needs: [changes, contracts, client, lobby, signaling, world, metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
